<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prayer Requests | The Foundery Church</title>
<style>
:root{--orange:#fb923c;--cream:#fff7ed;--muted:#aeb9cc;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;align-items:center;justify-content:center;color:white}
.widget{position:relative;width:100%;height:100%;min-height:260px;padding:clamp(24px,4vw,64px);display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 12% 20%,rgba(251,146,60,.15),transparent 30%),linear-gradient(135deg,#07101f 0%,#020817 100%);overflow:hidden}
.widget:after{content:"";position:absolute;inset:18px;border:1px solid rgba(251,146,60,.18);border-radius:30px;pointer-events:none}
.content{position:relative;z-index:2;width:min(1400px,92%);text-align:center}
.eyebrow{font-weight:800;letter-spacing:.28em;color:var(--orange);font-size:clamp(15px,1.5vw,25px);text-transform:uppercase;margin-bottom:22px}
.icon{font-size:clamp(36px,4vw,62px);margin-bottom:12px}
.request{font-size:clamp(32px,4.3vw,72px);line-height:1.12;font-weight:800;letter-spacing:-.035em;max-width:1250px;margin:0 auto;transition:opacity .55s ease,transform .55s ease}
.request.out{opacity:0;transform:translateY(12px)}
.footer{margin-top:34px;padding-top:22px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:clamp(15px,1.5vw,24px)}
.brand{color:#fff;font-weight:750;letter-spacing:.08em}.dot{color:var(--orange)}.url{color:#fed7aa;font-weight:700}
.progress{position:absolute;left:0;bottom:0;height:5px;background:var(--orange);width:0}
@keyframes fill{from{width:0}to{width:100%}}
</style>
</head>
<body>
<div class="widget">
  <main class="content">
    <div class="eyebrow">24 Hours of Prayer • Prayer Focus</div>
    <div class="icon">🙏</div>
    <div id="request" class="request"></div>
    <div class="footer"><span class="brand">THE FOUNDERY CHURCH</span><span class="dot">•</span><span>Pray with us</span><span class="dot">•</span><span class="url">pray.thefoundery.church</span></div>
  </main>
  <div id="progress" class="progress"></div>
</div>
<script>
const requests = [
  "Pray for Sam & Shelba.",
  "Pray for our Liberia mission trip — for safety, impact, and God’s direction.",
  "Pray for our children’s pastor and children’s ministry.",
  "Pray for those battling addiction — for freedom, strength, and lasting recovery.",
  "Pray for healing — physically, emotionally, and spiritually.",
  "Pray for those who need salvation and a life-changing encounter with Jesus.",
  "Pray for foster families — for strength, wisdom, stability, and love.",
  "Pray for marriages — for unity, restoration, patience, and deeper love.",
  "Pray for families facing financial hardship — for provision, opportunity, and peace.",
  "Pray for unity in our church and wisdom as we follow where God is leading.",
  "Pray for Cornerstone Christian Academy — its students, teachers, staff, and families.",
  "Pray for Grant & Delia.",
  "Pray for the Brooke County School District — students, teachers, staff, leaders, and families.",
  "Pray for Logan & Kristen on their journey toward growing their family — for hope, strength, peace, and God’s guidance."
];
const DISPLAY_MS=10000, FADE_MS=550;
let index=0;
const el=document.getElementById("request"), bar=document.getElementById("progress");
function resetBar(){bar.style.animation="none";void bar.offsetWidth;bar.style.animation="fill "+DISPLAY_MS+"ms linear forwards"}
function show(i){el.textContent=requests[i];el.classList.remove("out");resetBar()}
function next(){el.classList.add("out");setTimeout(()=>{index=(index+1)%requests.length;show(index)},FADE_MS)}
show(index);setInterval(next,DISPLAY_MS);
</script>
</body>
</html>
