<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Praying Now | The Foundery Church</title>
<style>
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;overflow:hidden;
  background:transparent!important;
  font-family:Inter,Arial,Helvetica,sans-serif;
}
body{color:#fff}
.stage{
  width:100vw;height:100vh;
  padding:5vh 5vw;
  display:flex;align-items:flex-start;justify-content:flex-start;
  background:transparent!important;
}
.panel{
  width:min(980px,72vw);
  background:transparent!important;
}
.label{
  font-size:clamp(18px,2.4vw,38px);
  color:#ff8a3d;
  letter-spacing:.32em;
  text-transform:uppercase;
  font-weight:800;
  line-height:1.1;
}
.name{
  font-size:clamp(54px,8.2vw,130px);
  font-weight:900;
  line-height:.94;
  margin-top:1.7vh;
  letter-spacing:-.05em;
  color:#fff;
  text-shadow:0 2px 12px rgba(0,0,0,.65);
}
.slot{
  font-size:clamp(27px,4vw,62px);
  color:#f8fafc;
  margin-top:1.6vh;
  font-weight:400;
  line-height:1.05;
  text-shadow:0 2px 10px rgba(0,0,0,.65);
}
.orangeLine{
  width:78px;height:7px;border-radius:999px;
  background:#ff7a2f;
  margin-top:3vh;
}
.divider{
  width:100%;
  height:1px;
  background:rgba(203,213,225,.42);
  margin:5vh 0 3.8vh;
}
.nextLabel{
  color:#a7b0bd;
  font-size:clamp(16px,2vw,29px);
  letter-spacing:.28em;
}
.nextName{
  font-size:clamp(34px,5vw,78px);
  font-weight:850;
  line-height:1;
  margin-top:1.5vh;
  letter-spacing:-.04em;
  color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.65);
}
.nextSlot{
  font-size:clamp(23px,3vw,45px);
  color:#cbd5e1;
  margin-top:1.3vh;
  font-weight:400;
  line-height:1.05;
  text-shadow:0 2px 10px rgba(0,0,0,.65);
}
.clockWrap{
  position:absolute;
  top:4.5vh;
  right:4.5vw;
  width:clamp(150px,18vw,260px);
  text-align:center;
}
.clock{
  position:relative;
  width:100%;
  aspect-ratio:1;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.8);
  background:rgba(2,6,23,.16);
  box-shadow:0 0 30px rgba(0,0,0,.28), inset 0 0 30px rgba(255,255,255,.03);
}
.tick{
  position:absolute;
  left:50%;top:50%;
  width:2px;height:8px;
  background:rgba(255,255,255,.75);
  transform-origin:50% calc(50% + 42%);
}
.tick.major{
  width:3px;height:13px;background:#ff8a3d;
}
.clock .num{
  position:absolute;
  font-weight:700;
  font-size:clamp(12px,1.5vw,22px);
  color:#fff;
  text-shadow:0 1px 6px rgba(0,0,0,.7);
}
.n12{top:7%;left:50%;transform:translateX(-50%)}
.n3{right:8%;top:50%;transform:translateY(-50%)}
.n6{bottom:6%;left:50%;transform:translateX(-50%)}
.n9{left:8%;top:50%;transform:translateY(-50%)}
.hand{
  position:absolute;
  left:50%;bottom:50%;
  transform-origin:50% 100%;
  border-radius:999px;
  box-shadow:0 1px 4px rgba(0,0,0,.45);
}
.hour{width:5px;height:25%;background:#fff}
.minute{width:4px;height:34%;background:#fff}
.second{width:2px;height:37%;background:#ff8a3d}
.centerDot{
  position:absolute;left:50%;top:50%;
  width:12px;height:12px;border-radius:50%;
  background:#ff8a3d;transform:translate(-50%,-50%);
  box-shadow:0 0 10px rgba(255,138,61,.7);
}
.digital{
  margin-top:1.2vh;
  color:#fff;
  font-size:clamp(18px,2vw,30px);
  font-weight:700;
  letter-spacing:.04em;
  text-shadow:0 2px 10px rgba(0,0,0,.65);
}
.zone{
  color:#a7b0bd;
  margin-top:.3vh;
  font-size:clamp(10px,1vw,14px);
  letter-spacing:.18em;
  text-transform:uppercase;
}
@media (max-width:800px){
  .panel{width:66vw}
  .clockWrap{width:clamp(120px,25vw,180px)}
}
</style>
</head>
<body>
<div class="stage">
  <section class="panel">
    <div class="label" id="nowLabel">Praying Now</div>
    <div class="name" id="name">—</div>
    <div class="slot" id="slot">—</div>
    <div class="orangeLine"></div>
    <div class="divider"></div>
    <div class="label nextLabel">Up Next</div>
    <div class="nextName" id="nextName">—</div>
    <div class="nextSlot" id="nextSlot">—</div>
  </section>

  <aside class="clockWrap" aria-label="Current Eastern Time">
    <div class="clock">
      <div class="num n12">12</div>
      <div class="num n3">3</div>
      <div class="num n6">6</div>
      <div class="num n9">9</div>
      <div class="hand hour" id="hourHand"></div>
      <div class="hand minute" id="minuteHand"></div>
      <div class="hand second" id="secondHand"></div>
      <div class="centerDot"></div>
    </div>
    <div class="digital" id="digitalClock">—</div>
    <div class="zone">Eastern Time</div>
  </aside>
</div>

<script>
const EVENT_START = new Date("2026-10-01T00:00:00-04:00").getTime();
const EVENT_END = EVENT_START + 24*60*60*1000;
const SLOT = 15*60*1000;

const SCHEDULE = [
"Rob Walker","Jacy Mozingo","Jeff Long","Sidney Mozingo","Rob Walker","Laura Greathouse","Laura Greathouse","Sidney Mozingo","Molly Musgrave","Pastor Bobby","Pastor Dave","Ryan Cook","Emily Cook","Jose Rojo","Jose Rojo","Jose Rojo","Kevin Fiber","Matt Thoma","Matt Thoma","Matt Thoma","Sandie Hart","Logan Urban","Tina Fiber","Cody Steele","Grant Vargo","Stacie Bennett","Baylee Steele","Brittany Wargo","Beverly Cook","Ellen Daugherty","Jim Haizlett",null,"Abbey Whaley","Abbey Whaley","JoEllen Haizlett","Courtney Vargo","Courtney Vargo","Heather McCullough","Seth Roseman","Madison Westfall","Debi Vukelic","Kristen Urban","Kristen Urban","Arabella / Charlotte Westfall","Judy Penrod","Jackson Westfall","Lucy Davis","Delia Vargo","Vera Keister","Janet Leary","Destini Parr","Destini Parr","Ruth Parry","Enoch Parry","Matt Thoma","Matt Thoma","Delia Vargo","Kathryn Grice","Kara Zanes","David Grice","Lisa Doyle","Lisa Doyle","Lisa Doyle","Lisa Doyle","Pastor Jim Miller","Doc Roe","Doc Roe","Cathy Moore","Missy Miller","Chris Mockbee","Pastor Jim Miller","Haizlett family","Josh Green","Josh Green","Josh Green","Stacy Westfall","Matt Thoma","Matt Thoma","Matt Thoma","Cathy Moore","Danny Vargo","Danny Vargo","Baylee Steele","Barbara Beatty","Logan Urban","Alexis Riggs","Cody Ann Michael","Ryan Smith","Brooke Smith","Margie Mitchell","Arley Mitchell",null,"Denise Aracich","Denise Aracich","Bobby Westfall","Bobby Westfall"
];

SCHEDULE[68] = "Missy Miller";
SCHEDULE[70] = "Pastor Jim Miller";

const fmt = ms => new Intl.DateTimeFormat("en-US",{
  timeZone:"America/New_York",
  hour:"numeric",
  minute:"2-digit"
}).format(new Date(ms));

function updateClock(now){
  const parts = new Intl.DateTimeFormat("en-US",{
    timeZone:"America/New_York",
    hour:"numeric",
    minute:"2-digit",
    second:"2-digit",
    hour12:true
  }).formatToParts(new Date(now));

  const get = t => parts.find(p=>p.type===t)?.value;
  const h = Number(get("hour")) % 12;
  const m = Number(get("minute"));
  const s = Number(get("second"));
  const hourDeg = h*30 + m*.5 + s/120;
  const minuteDeg = m*6 + s*.1;
  const secondDeg = s*6;

  document.getElementById("hourHand").style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;
  document.getElementById("minuteHand").style.transform = `translateX(-50%) rotate(${minuteDeg}deg)`;
  document.getElementById("secondHand").style.transform = `translateX(-50%) rotate(${secondDeg}deg)`;

  document.getElementById("digitalClock").textContent = new Intl.DateTimeFormat("en-US",{
    timeZone:"America/New_York",
    hour:"numeric",
    minute:"2-digit",
    second:"2-digit"
  }).format(new Date(now));
}

function tick(){
  const now = Date.now();
  updateClock(now);

  const state = now < EVENT_START ? "before" : now >= EVENT_END ? "after" : "live";
  const elapsed = Math.max(0,Math.min(EVENT_END-EVENT_START,now-EVENT_START));
  const idx = Math.max(0,Math.min(SCHEDULE.length-1,Math.floor(elapsed/SLOT)));
  const start = EVENT_START + idx*SLOT;
  const end = start + SLOT;
  const current = SCHEDULE[idx] || "Open Prayer Slot";

  document.getElementById("nowLabel").textContent =
    state==="live" ? "Praying Now" :
    state==="before" ? "Prayer Begins At Midnight" :
    "24 Hours Complete";

  document.getElementById("name").textContent =
    state==="before" ? "The Foundery Church" :
    state==="after" ? "Thank You for Praying" :
    current;

  document.getElementById("slot").textContent =
    state==="live" ? fmt(start)+" – "+fmt(end) :
    state==="before" ? "October 1, 2026" :
    "One continuous chain of prayer";

  const nextIdx = idx + 1;
  if(state==="live" && nextIdx < SCHEDULE.length){
    document.getElementById("nextName").textContent = SCHEDULE[nextIdx] || "Open Prayer Slot";
    document.getElementById("nextSlot").textContent =
      fmt(EVENT_START+nextIdx*SLOT)+" – "+fmt(EVENT_START+(nextIdx+1)*SLOT);
  } else if(state==="before"){
    document.getElementById("nextName").textContent = SCHEDULE[0] || "Open Prayer Slot";
    document.getElementById("nextSlot").textContent = fmt(EVENT_START)+" – "+fmt(EVENT_START+SLOT);
  } else {
    document.getElementById("nextName").textContent = "—";
    document.getElementById("nextSlot").textContent = "";
  }
}

tick();
setInterval(tick,1000);
</script>
</body>
</html>
