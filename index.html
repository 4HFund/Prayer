  <style>
    html { background:#020617; }
    body { margin:0; background:#020617; color:#f8fafc; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .glass-panel {
      background: rgba(15, 23, 42, 0.62);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,.06);
    }
    .scrollbar-custom::-webkit-scrollbar { width:6px; }
    .scrollbar-custom::-webkit-scrollbar-track { background:rgba(0,0,0,.2); border-radius:4px; }
    .scrollbar-custom::-webkit-scrollbar-thumb { background:rgba(255,255,255,.12); border-radius:4px; }
    .pulse-dot { animation:pulse 1.5s infinite; }
    .float-soft { animation:floatSoft 7s ease-in-out infinite; }
    .shimmer { background-size:200% 200%; animation:shimmer 7s ease infinite; }
    .fade-cycle { animation:fadeCycle 10s ease-in-out infinite; }
    .prompt-enter { animation:promptEnter .45s cubic-bezier(.2,.8,.2,1); }
    .soft-glow { box-shadow:0 0 0 1px rgba(251,146,60,.08),0 18px 70px rgba(249,115,22,.08); }
    .count-ring { filter:drop-shadow(0 0 6px rgba(251,146,60,.32)); }
    .chain-light { animation:chainLight 3.6s ease-in-out infinite; }
    .open-beacon { animation:openBeacon 2.2s ease-in-out infinite; }
    .orbit-breathe { animation:orbitBreathe 4s ease-in-out infinite; }
    .orbit-rotate { animation:orbitRotate 18s linear infinite; transform-origin:center; }
    .count-capsule { background:linear-gradient(180deg,rgba(30,41,59,.8),rgba(15,23,42,.6)); box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 10px 30px rgba(0,0,0,.2); }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.45;transform:scale(1.35)} }
    @keyframes floatSoft { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    @keyframes shimmer { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
    @keyframes fadeCycle { 0%,100%{opacity:.55} 50%{opacity:1} }
    @keyframes promptEnter { from{opacity:0;transform:translateY(8px) scale(.99)} to{opacity:1;transform:translateY(0) scale(1)} }
    @keyframes chainLight { 0%,100%{filter:brightness(.85);opacity:.72} 50%{filter:brightness(1.5);opacity:1} }
    @keyframes openBeacon { 0%,100%{box-shadow:0 0 6px rgba(45,212,191,.25)} 50%{box-shadow:0 0 18px rgba(45,212,191,.85)} }
    @keyframes orbitBreathe { 0%,100%{box-shadow:inset 0 0 30px rgba(249,115,22,.05),0 0 0 rgba(249,115,22,0)} 50%{box-shadow:inset 0 0 48px rgba(249,115,22,.12),0 0 45px rgba(249,115,22,.10)} }
    @keyframes orbitRotate { to{transform:rotate(360deg)} }
    button, input, textarea { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid #fb923c; outline-offset:2px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
    }
    @supports (padding: max(0px)) {
      body { padding-bottom: env(safe-area-inset-bottom); }
    }
  </style>
</head>

    const CATEGORIES = [
  {
    "title": "Healing and recovery",

    "prompts": [

  },
  {

    "desc": "People seeking God",
    "prompts": [

    ]
  }
];

    const GENERAL = {
      title:"October 1 Prayer List",
      prompts:CATEGORIES.flatMap(c=>c.prompts)
    };

    const SCRIPTURES = [
      ["James 5:13–16","The prayer of a righteous person is powerful and effective."],
      ["Philippians 4:6","In every situation, by prayer and petition, with thanksgiving, present your requests to God."],
      ["1 Thessalonians 5:17","Pray continually."],
      ["Matthew 18:20","For where two or three gather in my name, there am I with them."]
    ];

    const WALL = [
      "Praying for our children.",
      "Jesus, bring healing.",
      "Praying for Liberia.",
      "God, strengthen our families.",
      "Praying for our community.",
      "Jesus, draw people to You."
    ];

    function formatTime(ms) {
      return new Intl.DateTimeFormat("en-US",{
        timeZone:"America/New_York",hour:"numeric",minute:"2-digit"
      }).format(new Date(ms));
    }

    function countdownParts(ms) {
      const s=Math.max(0,Math.ceil(ms/1000));
      return {h:Math.floor(s/3600),m:Math.floor((s%3600)/60),s:s%60};
    }

    function countdown(ms) {
      if (ms <= 0) return "00:00";
      const s = Math.ceil(ms/1000);
      const h = Math.floor(s/3600);
      const m = Math.floor((s%3600)/60);
      const sec = s%60;
      return h>0 ? `${h}h ${m}m ${String(sec).padStart(2,"0")}s` : `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
    }

    function App() {
      const [now,setNow] = useState(Date.now());
      const [session,setSession] = useState(null);
      const [thanks,setThanks] = useState(false);
      const [signupSlot,setSignupSlot] = useState(null);
      const [prayedWith,setPrayedWith] = useState(false);

      useEffect(()=>{
        const id=setInterval(()=>setNow(Date.now()),1000);
        return ()=>clearInterval(id);
      },[]);

      const state = now < EVENT_START ? "before" : now >= EVENT_END ? "completed" : "in-progress";
      const elapsed = Math.max(0, Math.min(EVENT_END-EVENT_START, now-EVENT_START));
      const idx = Math.max(0, Math.min(SCHEDULE.length-1, Math.floor(elapsed/SLOT)));
      const progress = elapsed/(EVENT_END-EVENT_START);
      const nextBoundary = EVENT_START + (idx+1)*SLOT;
      const filled=SCHEDULE.filter(Boolean).length;
      const open=SCHEDULE.length-filled;

      const closeSession = () => {
        setSession(null);
        setThanks(true);
        setTimeout(()=>setThanks(false),4000);
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 overflow-x-hidden">
          <div className="fixed inset-0 pointer-events-none overflow-hidden">
            <div className="absolute -top-20 -right-20 w-96 h-96 rounded-full bg-slate-800/30 blur-3xl float-soft"></div>
            <div className="absolute top-1/3 -left-20 w-80 h-80 rounded-full bg-orange-900/20 blur-3xl float-soft"></div>
          </div>

          <div className="relative z-10 max-w-6xl mx-auto px-4 pb-24">
            <header className="pt-10 pb-8 text-center">
              <div className="mx-auto mb-6 flex justify-center">
                <div className="bg-white rounded-2xl px-5 py-4 shadow-2xl shadow-black/30">
                  <img src="https://img1.wsimg.com/isteam/ip/2d16522f-f140-4ab1-887b-4bd9f311f411/thumbnails/thumbnail-5a80e227-ef59-4e26-8a06-39959e42aeb4.png" alt="The Foundery Church" className="w-[250px] sm:w-[300px] h-auto object-contain"/>
                </div>
              </div>
              <h1 className="text-3xl md:text-5xl font-light tracking-tight"><strong>24 HOURS</strong> OF PRAYER</h1>
              <p className="text-slate-300 mt-3">One Church. One Prayer. Every 15 Minutes.</p>
              <p className="text-orange-400 uppercase tracking-[.22em] text-xs font-semibold mt-2">Sundays Are Just the Start.</p>
              <p className="text-slate-500 text-xs mt-4">The Foundery Church · Wellsburg, West Virginia</p>
            </header>

            <main className="grid lg:grid-cols-12 gap-8 mt-8">
              <section className="lg:col-span-5">
                <PrayerOrbit state={state} index={idx} progress={progress} now={now} nextBoundary={nextBoundary} />

                {state==="in-progress" && (
                  <div className="grid grid-cols-2 gap-3 mt-5">
                    <button onClick={()=>setSession(GENERAL)} className="rounded-2xl bg-orange-600 hover:bg-orange-500 py-4 font-bold tracking-wider uppercase flex items-center justify-center gap-2 shadow-lg">
                      <Icon name="play" size={18}/> Pray Now
                    </button>
                    <button onClick={()=>setPrayedWith(true)} className={`rounded-2xl border py-4 font-semibold flex items-center justify-center gap-2 ${prayedWith?"bg-emerald-500/10 border-emerald-500/30 text-emerald-300":"bg-white/5 border-white/10 hover:bg-white/10"}`}>
                      <Icon name="heart" size={18}/>{prayedWith?"Praying With Them":"Pray With Them"}
                    </button>
                  </div>
                )}

                {state!=="in-progress" && (
                  <button onClick={()=>setSession(GENERAL)} className="w-full mt-5 rounded-2xl bg-orange-600 hover:bg-orange-500 py-4 font-bold tracking-widest uppercase flex items-center justify-center gap-3 shadow-lg">
                    <Icon name="play" size={18}/>
                    {state==="completed" ? "Keep Praying" : "Take a Moment to Pray"}
                  </button>
                )}

                <div aria-live="polite" className="h-8 flex items-center justify-center text-emerald-400 text-sm">{thanks ? "Thank you for joining us in prayer." : prayedWith ? "You’re joining the prayer chain right now." : ""}</div>

              </section>

                    </div>

                  <div className="grid sm:grid-cols-2 gap-4">
                    {CATEGORIES.map((c,i)=>(

                </div>

                <ScriptureStrip/>
                <PrayerWall/>

                <div className="glass-panel rounded-3xl p-6 md:p-8">
                  <PrayerRequestForm/>
                </div>
              </section>
            </main>

            {state==="completed" && <CompletionPanel filled={filled}/>}

            <footer className="mt-14 pt-8 border-t border-white/5 text-center">
              <div className="text-[10px] uppercase tracking-[.28em] text-orange-400">The Foundery Church</div>
              <p className="text-slate-400 text-sm mt-3">1340 Washington Pike · Wellsburg, WV 26070</p>
              <div className="flex flex-wrap items-center justify-center gap-x-3 gap-y-2 mt-3 text-sm">
                <a href="tel:+13047370186" className="text-slate-300 hover:text-white transition">304-737-0186</a>
                <span className="text-slate-700 hidden sm:inline">•</span>
                <a href="https://thefoundery.church" target="_blank" rel="noopener noreferrer" className="text-orange-300 hover:text-orange-200 transition">thefoundery.church</a>

    }

    function PrayerChain({state,index,filled,open}) {
      const percent=Math.round((filled/96)*100);
      return (
        <div className="glass-panel soft-glow rounded-3xl p-5 md:p-6 relative overflow-hidden">
          <div className="absolute inset-0 pointer-events-none bg-[radial-gradient(circle_at_80%_15%,rgba(45,212,191,.07),transparent_32%),radial-gradient(circle_at_15%_100%,rgba(249,115,22,.07),transparent_34%)]"></div>
          <div className="relative">
            <div className="flex flex-col md:flex-row md:items-end justify-between gap-4">
              <div>
                <div className="text-xs tracking-[.28em] uppercase text-orange-400">The Prayer Chain</div>
                <div className="text-3xl md:text-4xl font-light mt-2"><span className="text-white">{filled}</span> <span className="text-slate-400">of 96 slots covered</span></div>
                <p className="text-slate-400 text-sm mt-2">{open===0 ? "Every prayer period is covered." : `${open} open ${open===1?"spot":"spots"} still need someone.`}</p>
              </div>
              <div className="md:text-right min-w-[150px]">
                <div className="text-2xl font-light text-white">{percent}%</div>
                <div className="text-[10px] uppercase tracking-[.2em] text-slate-500">Scheduled</div>
              </div>
            </div>

            <div className="mt-5 h-1.5 rounded-full bg-white/5 overflow-hidden">
              <div className="h-full rounded-full bg-gradient-to-r from-orange-700 via-orange-400 to-teal-300 transition-all duration-700 shadow-[0_0_14px_rgba(251,146,60,.35)]" style={{width:`${percent}%`}}></div>
            </div>

            <div className="grid gap-1.5 mt-6" style={{gridTemplateColumns:"repeat(24,minmax(0,1fr))"}}>
              {SCHEDULE.map((name,i)=>{
                const completed=state==="completed" || (state==="in-progress" && i<index);
                const current=state==="in-progress" && i===index;
                const openSlot=!name;
                let cls="bg-slate-700/90";
                if(openSlot) cls="bg-teal-400 open-beacon";
                if(completed) cls="bg-orange-700 shadow-[0_0_8px_rgba(194,65,12,.28)]";
                if(current) cls="bg-orange-300 shadow-[0_0_22px_rgba(251,146,60,.95)] pulse-dot";
                const delay={animationDelay:`${(i%24)*70}ms`};
                return <div key={i} title={`${formatTime(EVENT_START+i*SLOT)} · ${name||"Open"}`} style={name&&!current&&!completed?delay:undefined} className={`h-3 rounded-full transition-all ${cls} ${name&&!current&&!completed?"chain-light":""}`}></div>
              })}
            </div>
            <div className="flex flex-wrap gap-x-5 gap-y-2 text-[11px] mt-5 text-slate-500">
              {state!=="before" && <span><i className="inline-block w-2 h-2 rounded-full bg-orange-700 mr-1"></i>Completed</span>}
              {state==="in-progress" && <span><i className="inline-block w-2 h-2 rounded-full bg-orange-300 mr-1 shadow-[0_0_8px_rgba(251,146,60,.8)]"></i>Now</span>}
              <span><i className="inline-block w-2 h-2 rounded-full bg-slate-700 mr-1"></i>Scheduled</span>
              <span className="text-teal-300"><i className="inline-block w-2 h-2 rounded-full bg-teal-400 mr-1 shadow-[0_0_8px_rgba(45,212,191,.7)]"></i>Open</span>
            </div>
          </div>
        </div>
      );
    }

    function PrayerOrbit({state,index,progress,now,nextBoundary}) {
      const current = SCHEDULE[index];
      const hasNext = index < SCHEDULE.length-1;
      const next = hasNext ? SCHEDULE[index+1] : null;
      const start = EVENT_START + index*SLOT;
      const end = start + SLOT;
      const cx=150, cy=150, radius=126;
      // SVG pointer starts at 12 o'clock. rotate(0) = 12 AM, 90 = 6 AM, 180 = 12 PM, 270 = 6 PM.
      // No -90 offset is needed because SVG rotation is applied to an element already positioned at 12 o'clock.
      const clockDate = new Date(now);
      const easternParts = new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",hour:"numeric",minute:"numeric",second:"numeric",hourCycle:"h23"}).formatToParts(clockDate);
      const eastern = Object.fromEntries(easternParts.map(p=>[p.type,Number(p.value)]));
      const clockHours = eastern.hour + eastern.minute/60 + eastern.second/3600;
      const angle = state==="in-progress" ? clockHours * 15 : 0;
      const handAngle = angle;
      const marks = Array.from({length:24},(_,i)=>i);

      return (
        <div className="flex flex-col items-center">
          <div className="relative w-full max-w-[390px] aspect-square">
            <div className="absolute inset-[5%] rounded-full bg-gradient-to-br from-slate-800/70 via-slate-950 to-black border border-white/10 shadow-[0_0_80px_rgba(249,115,22,.10),inset_0_0_45px_rgba(255,255,255,.035)]"></div>
            <svg viewBox="0 0 300 300" className="absolute inset-0 w-full h-full drop-shadow-2xl">
              <defs>
                <radialGradient id="dialFace"><stop offset="0%" stopColor="#172033"/><stop offset="68%" stopColor="#070d19"/><stop offset="100%" stopColor="#020617"/></radialGradient>
                <linearGradient id="dayNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#0f172a"/><stop offset="23%" stopColor="#4338ca" stopOpacity=".22"/><stop offset="42%" stopColor="#f59e0b" stopOpacity=".18"/><stop offset="58%" stopColor="#fbbf24" stopOpacity=".14"/><stop offset="78%" stopColor="#ea580c" stopOpacity=".20"/><stop offset="100%" stopColor="#020617"/></linearGradient>
                <radialGradient id="centerAura"><stop offset="0%" stopColor="#fb923c" stopOpacity=".15"/><stop offset="55%" stopColor="#f97316" stopOpacity=".035"/><stop offset="100%" stopColor="#020617" stopOpacity="0"/></radialGradient>
                <linearGradient id="sunArc" x1="0" y1="0" x2="1" y2="1"><stop stopColor="#fb923c"/><stop offset=".55" stopColor="#f97316"/><stop offset="1" stopColor="#c2410c"/></linearGradient>
                <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
              </defs>
              <circle cx={cx} cy={cy} r="134" fill="url(#dialFace)" stroke="rgba(255,255,255,.10)" strokeWidth="1"/>
              <circle cx={cx} cy={cy} r="132" fill="url(#dayNight)" opacity=".9"/>
              <circle cx={cx} cy={cy} r="92" fill="url(#centerAura)" className="orbit-breathe"/>
              <circle cx={cx} cy={cy} r={radius} fill="none" stroke="rgba(255,255,255,.06)" strokeWidth="10"/>
              <circle cx={cx} cy={cy} r="130" fill="none" stroke="rgba(251,146,60,.16)" strokeWidth="1" strokeDasharray="1 12" className="orbit-rotate"/>
              {marks.map(i=>{
                const a=(i/24)*Math.PI*2-Math.PI/2;
                const major=i%6===0;
                const x1=cx+Math.cos(a)*(major?111:116), y1=cy+Math.sin(a)*(major?111:116);
                const x2=cx+Math.cos(a)*124, y2=cy+Math.sin(a)*124;
                return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={i<=Math.floor(index/4) && state!=="before" ? "#f97316" : "rgba(255,255,255,.25)"} strokeWidth={major?3:1.5} strokeLinecap="round"/>;
              })}
              {state!=="before" && <circle cx={cx} cy={cy} r={radius} fill="none" stroke="url(#sunArc)" strokeWidth="5" strokeLinecap="round" pathLength="100" strokeDasharray={`${progress*100} 100`} transform="rotate(-90 150 150)" filter="url(#glow)"/>}
              <g transform={`rotate(${angle} 150 150)`}>
                <circle cx="150" cy="24" r="15" fill="#f97316" fillOpacity=".08" className="orbit-breathe"/>
                <circle cx="150" cy="24" r="6" fill="#fff" filter="url(#glow)"/>
                <circle cx="150" cy="24" r="12" fill="none" stroke="#f97316" strokeOpacity=".5"/>
              </g>
              {state==="in-progress" && <g transform={`rotate(${handAngle} 150 150)`}>
                <line x1="150" y1="150" x2="150" y2="62" stroke="url(#sunArc)" strokeWidth="3" strokeLinecap="round" filter="url(#glow)"/>
                <path d="M150 48 L143 72 L157 72 Z" fill="#fb923c"/>
              </g>}
              <circle cx="150" cy="150" r="9" fill="#f97316" filter="url(#glow)"/>
              <circle cx="150" cy="150" r="3" fill="#fff"/>
              <text x="150" y="45" textAnchor="middle" fill="#f8fafc" fontSize="10" fontWeight="700">12 AM</text>
              <text x="256" y="153" textAnchor="middle" fill="#cbd5e1" fontSize="10" fontWeight="700">6 AM</text>
              <text x="150" y="266" textAnchor="middle" fill="#f8fafc" fontSize="10" fontWeight="700">12 PM</text>
              <text x="44" y="153" textAnchor="middle" fill="#cbd5e1" fontSize="10" fontWeight="700">6 PM</text>
              <text x="224" y="78" textAnchor="middle" fill="#94a3b8" fontSize="8" fontWeight="600">3 AM</text>
              <text x="224" y="228" textAnchor="middle" fill="#94a3b8" fontSize="8" fontWeight="600">9 AM</text>
              <text x="76" y="228" textAnchor="middle" fill="#94a3b8" fontSize="8" fontWeight="600">3 PM</text>
              <text x="76" y="78" textAnchor="middle" fill="#94a3b8" fontSize="8" fontWeight="600">9 PM</text>
            </svg>

            <div className="absolute inset-[23%] rounded-full bg-slate-950/85 border border-orange-400/10 orbit-breathe flex flex-col items-center justify-center text-center px-5">
              {state==="in-progress" && <>
                <div className="flex items-center gap-2 text-orange-400 text-[10px] font-bold tracking-[.2em] uppercase mb-3">
                  <span className="w-2 h-2 rounded-full bg-orange-500 pulse-dot"></span> Praying Now
                </div>
                <div className="text-2xl md:text-3xl font-bold tabular-nums text-white mb-1">{formatTime(now)}</div>
                <h3 className="text-base md:text-lg font-semibold leading-tight">{current || "Open prayer slot"}</h3>
                <p className="text-slate-400 text-[10px] mt-1">{current ? `${current} is carrying the prayer forward.` : "This prayer period still needs someone."}</p>
                <p className="text-slate-300 text-[11px] mt-2 tracking-widest uppercase">{formatTime(start)} – {formatTime(end)}</p>
                <div className="mt-3 px-3 py-1 rounded-full bg-orange-500/10 border border-orange-500/20 text-orange-300 text-[10px] tracking-wider">
                  SLOT {index+1} OF 96 · {Math.round(progress*100)}% COMPLETE
                </div>
              </>}
              {state==="before" && <><h3 className="text-2xl font-light">Begins Soon</h3><p className="text-orange-400 mt-2 text-sm">October 1, 2026</p><p className="text-slate-400 text-xs mt-1">12:00 AM Eastern</p></>}
              {state==="completed" && <><Icon name="check" size={26} className="text-orange-400 mb-2"/><h3 className="text-2xl font-light">24 Hours Complete</h3><p className="text-slate-400 text-xs mt-2">The chain of prayer is complete.</p></>}
            </div>
          </div>

          <div className="min-h-14 text-center mt-1">
            {state==="in-progress" && (hasNext
              ? <><p className="text-sm text-slate-300">Next: <span className={next?"text-white font-medium":"text-teal-300 font-semibold"}>{next || "Open prayer slot — needs someone"}</span></p><p className="text-xs text-orange-400/80 mt-1 font-mono">HANDOFF IN {countdown(nextBoundary-now)}</p></>
              : <><p className="text-sm text-slate-300">Our final prayer slot</p><p className="text-xs text-orange-400/80 mt-1 font-mono">ENDS IN {countdown(EVENT_END-now)}</p></>
            )}
            {state==="before" && (()=>{const t=countdownParts(EVENT_START-now);return <div className="mt-3">
              <div className="text-[10px] uppercase tracking-[.28em] text-orange-400 mb-2">The Chain Begins In</div>
              <div className="flex items-center justify-center gap-2">
                {[[t.h,"HRS"],[t.m,"MIN"],[t.s,"SEC"]].map(([v,label])=><div key={label} className="count-capsule rounded-xl px-3 py-2 min-w-[62px] border border-white/5">

    function Timeline({state,index,onClaim}) {
      const ref = useRef(null);
      useEffect(()=>{
        if(state==="in-progress" && ref.current){
          const el=ref.current.querySelector('[data-current="true"]');
          if(el) setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"center"}),100);
        }
      },[state,index]);

      return (
        <div className="glass-panel rounded-3xl p-4 sm:p-6">
          <div ref={ref} className="max-h-[410px] overflow-y-auto scrollbar-custom pr-2">
            {SCHEDULE.map((name,i)=>{
              const past=state==="completed" || (state==="in-progress" && i<index);
              const current=state==="in-progress" && i===index;
              const open=!name;
              return (
                <button type="button" onClick={()=>open && !past && onClaim(i)} key={i} data-current={current?"true":"false"} disabled={!open || past} className={`w-full text-left flex items-center gap-4 py-3 px-3 rounded-xl border transition ${current?"bg-orange-900/20 border-orange-500/20":open&&!past?"bg-teal-950/50 border-teal-500/40 hover:border-teal-300 hover:bg-teal-900/40":"border-transparent"} ${past?"opacity-55":""}`}>
                  <div className="w-6 flex justify-center">
                    {past ? <Icon name="circle-check" size={22} className="text-slate-500"/> : <span className={`w-3 h-3 rounded-full ${current?"bg-orange-500":open?"bg-teal-400":"bg-slate-700"}`}></span>}
                  </div>
                  <div className="min-w-0 flex-1 flex items-center justify-between gap-4">
                    <div className="min-w-0">
                      <span className={`block truncate ${current?"font-semibold text-white":open?"font-semibold text-teal-300":"text-slate-200"}`}>{name || "Open prayer slot"}</span>
                      {open&&!past && <span className="text-[10px] text-teal-400/80">Tap to volunteer</span>}
                    </div>
                    <span className={`font-mono text-sm shrink-0 ${current?"text-orange-400":open?"text-teal-300":"text-slate-500"}`}>{formatTime(EVENT_START+i*SLOT)}</span>
                  </div>
                </button>
              );
            })}
          </div>
          <p className="text-center text-xs text-slate-500 mt-4 pt-4 border-t border-slate-800"><span className="text-teal-300">Teal = open prayer slot.</span> All times shown in Eastern Time.</p>
        </div>
      );
    }

    function PrayerSession({category,onClose}) {
      const [step,setStep]=useState(0);
      const [auto,setAuto]=useState(true);
      const [elapsed,setElapsed]=useState(0);
      const [secondsToNext,setSecondsToNext]=useState(20);
      const timerRef=useRef(null);
      const wakeLockRef=useRef(null);
      const haptic=()=>{ try{ if(navigator.vibrate) navigator.vibrate(12); }catch{} };
      const stages=[
        ["Praise","Thank God for His goodness, grace, and mercy."],
        ["Church","Pray for The Foundery, its leaders, ministries, and unity."],
        ["Healing","Bring physical, emotional, and spiritual needs before God."],
        ["Families & Salvation","Pray for homes, freedom, restoration, and people to know Jesus."],
        ["Mission","Pray for the community, schools, Liberia, and what God is asking of you."]
      ];

      const move=(delta)=>{
        haptic();
        setStep(v=>(v+delta+category.prompts.length)%category.prompts.length);
        setSecondsToNext(20);
      };
      const goTo=(n)=>{ haptic(); setStep(n); setSecondsToNext(20); };

      useEffect(()=>{
        timerRef.current=setInterval(()=>{
          setElapsed(v=>v+1);
          if(auto){
            setSecondsToNext(v=>{
              if(v<=1){
                haptic();
                setStep(s=>(s+1)%category.prompts.length);
                return 20;
              }
              return v-1;
            });
          }
        },1000);
        return ()=>clearInterval(timerRef.current);
      },[auto,category.prompts.length]);

      useEffect(()=>{
        let active=true;
        const requestWake=async()=>{
          try{
            if("wakeLock" in navigator && document.visibilityState==="visible"){
              wakeLockRef.current=await navigator.wakeLock.request("screen");
            }
          }catch{}
        };
        requestWake();
        const visible=()=>{ if(active && document.visibilityState==="visible" && !wakeLockRef.current) requestWake(); };
        document.addEventListener("visibilitychange",visible);
        return ()=>{
          active=false;
          document.removeEventListener("visibilitychange",visible);
          try{ wakeLockRef.current?.release(); }catch{}
          wakeLockRef.current=null;
        };
      },[]);

      useEffect(()=>{
        const fn=(e)=>{
          if(e.key==="Escape") onClose();
          if(e.key==="ArrowRight") move(1);
          if(e.key==="ArrowLeft") move(-1);
        };
        window.addEventListener("keydown",fn);
        document.body.style.overflow="hidden";
        return ()=>{window.removeEventListener("keydown",fn);document.body.style.overflow="";};
      },[onClose,category.prompts.length]);

      const stage=step%stages.length;
      const elapsedText=`${Math.floor(elapsed/60)}:${String(elapsed%60).padStart(2,"0")}`;
      const pct=Math.min(100,(elapsed/(15*60))*100);
      const ring=2*Math.PI*18;
      const ringOffset=ring*(1-secondsToNext/20);

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex items-center justify-center p-3 sm:p-4 overflow-y-auto" role="dialog" aria-modal="true" aria-label={category.title}>
          <div className="glass-panel soft-glow bg-slate-900 rounded-3xl w-full max-w-3xl overflow-hidden shadow-2xl my-auto">
            <div className="sr-only" aria-live="polite">Now praying: {stages[stage][0]}. {category.prompts[step]}</div>
            <div className="h-1 bg-white/5"><div className="h-full bg-orange-500 transition-all" style={{width:`${pct}%`}}></div></div>
            <div className="flex items-center justify-between p-5 border-b border-white/10">
              <div className="min-w-0 pr-3">
                <div className="text-orange-400 font-medium truncate">{category.title}</div>
                <div className="text-xs text-slate-500 mt-1">15-minute guided prayer · {auto?"Advances automatically every 20 seconds":"Automatic advance paused"}</div>
              </div>
              <div className="flex items-center gap-2">
                <div className="relative w-12 h-12 shrink-0" aria-label={auto?`Next focus in ${secondsToNext} seconds`:"Paused"}>
                  <svg viewBox="0 0 44 44" className="w-12 h-12 -rotate-90 count-ring">
                    <circle cx="22" cy="22" r="18" fill="none" stroke="rgba(255,255,255,.08)" strokeWidth="3"/>
                    <circle cx="22" cy="22" r="18" fill="none" stroke="#fb923c" strokeWidth="3" strokeLinecap="round" strokeDasharray={ring} strokeDashoffset={auto?ringOffset:ring} className="transition-all duration-1000"/>
                  </svg>
                  <span className="absolute inset-0 grid place-items-center text-[11px] font-mono text-orange-300">{auto?secondsToNext:"II"}</span>
                </div>
              <button type="button" aria-label="Close guided prayer" onClick={onClose} className="shrink-0 w-12 h-12 rounded-full bg-white/10 active:bg-white/20 grid place-items-center touch-manipulation"><Icon name="x" size={22}/></button>
              </div>
            </div>

            <div className="px-5 sm:px-6 pt-5">
              <div className="grid grid-cols-5 gap-2">
                {stages.map((s,n)=><div key={n} className={`h-1.5 rounded-full transition-colors ${n===stage?"bg-orange-500":"bg-white/10"}`}></div>)}
              </div>
              <div key={`stage-${stage}`} className="text-center mt-4 min-h-[62px] prompt-enter">
                <div className="text-xs uppercase tracking-[.2em] text-orange-400">{stages[stage][0]}</div>
                <div className="text-sm text-slate-400 mt-1">{stages[stage][1]}</div>
              </div>
            </div>

            <div key={`prompt-${step}`} className="min-h-[250px] p-6 sm:p-8 md:p-12 flex items-center justify-center text-center prompt-enter">
              <p className="text-2xl md:text-4xl font-light leading-relaxed text-balance">“{category.prompts[step]}”</p>
            </div>

            <div className="px-6 pb-3 text-center text-xs text-slate-500 min-h-[38px]">
              {SCRIPTURES[step%SCRIPTURES.length][0]} · “{SCRIPTURES[step%SCRIPTURES.length][1]}”
            </div>

            <div className="p-4 sm:p-5 bg-slate-950/50">
              <div className="flex justify-center flex-wrap gap-2 mb-5">
                {category.prompts.map((_,n)=><button type="button" key={n} onClick={()=>goTo(n)} className={`h-3 rounded-full touch-manipulation transition-all ${n===step?"w-9 bg-orange-500":"w-3 bg-white/20 active:bg-white/40"}`} aria-label={`Go to prayer prompt ${n+1}`}></button>)}
              </div>

              <div className="grid grid-cols-[52px_1fr_52px] gap-3 items-center max-w-md mx-auto">
                <button type="button" aria-label="Previous prayer prompt" onClick={()=>move(-1)} className="w-[52px] h-[52px] rounded-full bg-white/5 active:bg-white/20 grid place-items-center touch-manipulation"><Icon name="chevron-left" size={28}/></button>
                <button type="button" onClick={()=>{haptic();setAuto(v=>!v);setSecondsToNext(20)}} className={`h-[52px] rounded-full border flex items-center justify-center gap-2 touch-manipulation active:scale-[.98] ${auto?"border-orange-500/30 text-orange-300 bg-orange-500/10":"border-white/10 text-slate-200 bg-white/5"}`}><Icon name={auto?"pause":"play"} size={20}/> {auto?"Pause":"Resume"}</button>
                <button type="button" aria-label="Next prayer prompt" onClick={()=>move(1)} className="w-[52px] h-[52px] rounded-full bg-white/10 active:bg-white/20 grid place-items-center touch-manipulation"><Icon name="chevron-right" size={28}/></button>
              </div>

              <div className="grid grid-cols-[1fr_1.6fr] gap-3 items-center mt-4 max-w-md mx-auto">
                <div className="text-center">
                  <div className="text-[10px] text-slate-500 uppercase tracking-wider">Praying for</div>
                  <div className="font-mono text-slate-300 text-lg">{elapsedText}</div>
                </div>
                <button type="button" onClick={onClose} className="h-[52px] rounded-xl bg-white/10 active:bg-white/20 font-medium touch-manipulation">Finish Praying</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function ScriptureStrip(){
      const [i,setI]=useState(0);
      useEffect(()=>{const id=setInterval(()=>setI(v=>(v+1)%SCRIPTURES.length),9000);return()=>clearInterval(id)},[]);
      return (
        <div className="rounded-3xl border border-orange-500/15 bg-gradient-to-br from-orange-950/20 via-slate-900/60 to-slate-950 p-6 text-center">
          <div className="text-[10px] uppercase tracking-[.25em] text-orange-400">Scripture for the hour</div>
          <blockquote className="text-xl md:text-2xl font-light mt-3 leading-relaxed">“{SCRIPTURES[i][1]}”</blockquote>
          <div className="text-sm text-slate-400 mt-3">{SCRIPTURES[i][0]}</div>
        </div>
      );
    }

    function PrayerWall(){
      const [i,setI]=useState(0);
      useEffect(()=>{const id=setInterval(()=>setI(v=>(v+1)%WALL.length),7000);return()=>clearInterval(id)},[]);
      return (
        <div className="glass-panel rounded-3xl p-6 text-center overflow-hidden">
          <div className="text-[10px] uppercase tracking-[.25em] text-slate-500">Prayer Wall</div>
          <div className="text-2xl md:text-3xl font-light mt-4 fade-cycle">“{WALL[i]}”</div>
          <p className="text-xs text-slate-500 mt-3">A rotating reminder of the prayers our church is carrying together.</p>
        </div>
      );
    }

    function CompletionPanel({filled}){
      return (
        <div className="mt-10 rounded-3xl border border-orange-500/20 bg-gradient-to-br from-orange-950/30 via-slate-900 to-slate-950 p-8 md:p-12 text-center">
          <div className="text-orange-400 text-xs uppercase tracking-[.28em]">24 Hours Complete</div>
          <h2 className="text-4xl md:text-6xl font-light mt-3">One continuous chain of prayer.</h2>
          <div className="grid sm:grid-cols-3 gap-4 mt-8 max-w-3xl mx-auto">
            <div className="glass-panel rounded-2xl p-5"><div className="text-3xl font-bold">24</div><div className="text-xs text-slate-400 mt-1">Hours</div></div>
            <div className="glass-panel rounded-2xl p-5"><div className="text-3xl font-bold">96</div><div className="text-xs text-slate-400 mt-1">Prayer periods</div></div>
            <div className="glass-panel rounded-2xl p-5"><div className="text-3xl font-bold">{filled}</div><div className="text-xs text-slate-400 mt-1">Scheduled periods</div></div>
          </div>
          <p className="text-slate-400 mt-7">The 24-hour event may be complete, but prayer does not stop here.</p>
        </div>
      );
    }

    function SlotSignup({slot,onClose}){
      const [status,setStatus]=useState("idle");
      const [error,setError]=useState("");
      const start=EVENT_START+slot*SLOT, end=start+SLOT;
      const submit=async(e)=>{
        e.preventDefault();
        const form=e.currentTarget;
        const data=new FormData(form);
        const name=String(data.get("name")||"").trim();
        if(!name){setError("Please enter your name.");return;}
        setStatus("sending"); setError("");
        try{
          const payload=new FormData();
          payload.append("name",name);
          payload.append("message",`Prayer slot volunteer: ${formatTime(start)} – ${formatTime(end)} Eastern on October 1, 2026.`);
          const response=await fetch("https://formspree.io/f/meaonlql",{method:"POST",headers:{"Accept":"application/json"},body:payload});
          if(!response.ok) throw new Error("We couldn't send your signup. Please try again.");
          setStatus("sent");
        }catch(err){setStatus("error");setError(err.message||"We couldn't send your signup.");}
      };
      return (
        <div className="fixed inset-0 z-[60] bg-slate-950/95 backdrop-blur-md flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-label="Volunteer for an open prayer slot">
          <div className="glass-panel rounded-3xl p-6 md:p-8 w-full max-w-md">
            <div className="flex justify-between gap-4">
              <div><div className="text-teal-300 text-xs uppercase tracking-[.2em]">Open Prayer Slot</div><h3 className="text-2xl font-light mt-2">{formatTime(start)} – {formatTime(end)}</h3></div>
              <button type="button" onClick={onClose} className="w-10 h-10 rounded-full bg-white/5 grid place-items-center"><Icon name="x" size={20}/></button>
            </div>
            {status==="sent" ? (
              <div className="text-center py-8"><Icon name="circle-check" size={38} className="text-emerald-400"/><h4 className="text-xl mt-4">Thank you for stepping into the prayer chain.</h4><p className="text-slate-400 text-sm mt-2">Your signup was sent to the church office.</p><button type="button" onClick={onClose} className="mt-6 px-5 py-3 rounded-xl bg-white/10">Close</button></div>
            ) : (
              <form onSubmit={submit} className="mt-6 space-y-4">
                <p className="text-sm text-slate-400">Enter your name and we’ll send this volunteer slot directly to the church office.</p>
                <label htmlFor="slot-name" className="text-sm text-slate-300">Your name</label><input id="slot-name" name="name" autoComplete="name" required placeholder="Your name" className="mt-1.5 w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-teal-400/60"/>
                {error&&<p className="text-red-400 text-sm">{error}</p>}
                <button disabled={status==="sending"} className="w-full rounded-xl py-3.5 bg-teal-500 text-slate-950 font-bold hover:bg-teal-400 disabled:opacity-50">{status==="sending"?"Sending…":"I’ll Pray at This Time"}</button>
              </form>
            )}
          </div>
        </div>
      );
    }

    function PrayerRequestForm() {
      const [status,setStatus]=useState("idle");
      const [error,setError]=useState("");

      const submit=async(e)=>{
        e.preventDefault();
        if(status==="sending") return;
        const form=e.currentTarget;
        const data=new FormData(form);
        const request=String(data.get("request")||"").trim();
        const name=String(data.get("name")||"").trim();
        if(!request){setError("Please enter a prayer request.");return;}
        if(data.get("_honey")) {setError("We couldn't send your request. Please try again.");return;}
        setError("");
        setStatus("sending");

        try {
          const payload=new FormData();
          payload.append("name",name || "Anonymous");
          payload.append("message",request);
          const response=await fetch("https://formspree.io/f/meaonlql",{
            method:"POST",
            headers:{"Accept":"application/json"},
            body:payload
          });
          if(!response.ok) {
            if(response.status===429) throw new Error("Too many requests right now. Please wait a minute and try again.");
            const result=await response.json().catch(()=>null);
            throw new Error(result?.errors?.map(e=>e.message).join(" ") || "The form service couldn't accept your request. Please try again.");
          }
          setStatus("sent");
          form.reset();
        } catch(err) {
          setStatus("error");
          setError(err.message || "We couldn't send your request. Please try again.");
        }
      };

      return (
        <form onSubmit={submit} className="space-y-4">
          <div>
            <h3 className="text-2xl font-light">How can we pray for you?</h3>
            <p className="text-slate-400 text-sm mt-1">Send your request privately without opening your email app. It goes directly to the church office.</p>
          </div>

          <div>
            <label htmlFor="name" className="text-sm text-slate-300">Name <span className="text-slate-500">(Optional)</span></label>
            <input id="name" name="name" maxLength="100" className="mt-1.5 w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-orange-500/50"/>
          </div>

          <div>
            <label htmlFor="request" className="text-sm text-slate-300">Prayer Request</label>
            <textarea id="request" name="request" required rows="5" maxLength="2000" className="mt-1.5 w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-3 outline-none resize-none focus:border-orange-500/50"></textarea>
          </div>

          <div className="absolute -left-[9999px]" aria-hidden="true"><label htmlFor="prayer-website">Website</label><input id="prayer-website" name="_honey" tabIndex="-1" autoComplete="off"/></div>
          {error && <p role="alert" className="text-red-400 text-sm">{error}</p>}
          {status==="sent" && <p role="status" className="text-emerald-400 text-sm">Your request was submitted. Thank you for letting us pray with you.</p>}

          <button type="submit" disabled={status==="sending"} className="w-full rounded-xl py-3.5 bg-white/5 hover:bg-white/10 border border-white/10 font-medium disabled:opacity-50">
            {status==="sending" ? "Sending…" : "Send Request"}
          </button>
        </form>
      );
    }

    function ShareControls(){
      const [copied,setCopied]=useState(false);
      const copy=async()=>{
        try{
          await navigator.clipboard.writeText(location.href);
          setCopied(true);setTimeout(()=>setCopied(false),2500);
        }catch{}
      };
      const share=async()=>{
        if(navigator.share){
          try{await navigator.share({title:"24 Hours of Prayer - The Foundery Church",text:"Join The Foundery Church in 24 Hours of Prayer.",url:location.href});return;}catch{}
        }
        copy();
      };
      return (
        <div className="glass-panel rounded-2xl p-1.5 flex gap-1 max-w-sm mx-auto">
          <button type="button" onClick={copy} className="flex-1 py-3 rounded-xl hover:bg-white/5 text-xs uppercase tracking-widest flex items-center justify-center gap-2"><Icon name="copy" size={16}/>{copied?"Copied!":"Copy Link"}</button>
          <div className="w-px bg-slate-700 my-2"></div>
          <button type="button" onClick={share} className="flex-1 py-3 rounded-xl hover:bg-white/5 text-xs uppercase tracking-widest flex items-center justify-center gap-2"><Icon name="share-2" size={16}/>Share</button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
