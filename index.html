<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020617" />
  <title>24 Hours of Prayer | The Foundery Church</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>

  <style>
    html { background:#020617; }
    body { margin:0; background:#020617; color:#f8fafc; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .glass-panel {
      background: rgba(15, 23, 42, 0.62);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,.06);
    }
    .scrollbar-custom::-webkit-scrollbar { width:6px; }
    .scrollbar-custom::-webkit-scrollbar-track { background:rgba(0,0,0,.2); border-radius:4px; }
    .scrollbar-custom::-webkit-scrollbar-thumb { background:rgba(255,255,255,.12); border-radius:4px; }
    .pulse-dot { animation:pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.45;transform:scale(1.35)} }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const {useEffect, useRef, useState} = React;

    const Icon = ({name, size=20, className=""}) => {
      const ref = useRef(null);
      useEffect(() => {
        if (window.lucide && ref.current) {
          ref.current.innerHTML = "";
          const node = document.createElement("i");
          node.setAttribute("data-lucide", name);
          ref.current.appendChild(node);
          window.lucide.createIcons({attrs:{width:size,height:size}, nameAttr:"data-lucide"});
        }
      }, [name,size]);
      return <span ref={ref} className={className} aria-hidden="true" />;
    };

    const EVENT_START = new Date("2026-09-29T00:00:00-04:00").getTime();
    const EVENT_END = EVENT_START + 24 * 60 * 60 * 1000;
    const HOUR = 60 * 60 * 1000;

    const SCHEDULE = [
      "Sarah Mitchell","David Kim","Emily Rodriguez","Michael Turner",
      "Jessica Lee","Brian Hayes","Amanda Foster","Robert Chen",
      "Sidney Prescott","Amy Williams","David O'Connor","Lisa Barnes",
      "Mark Stevens","Anna Kowalski","James Thompson","Rachel Green",
      "John Martinez","Maria Garcia","Peter Wright","Chloe Bennett",
      "Daniel Evans","Grace Taylor","Kevin White","Olivia Martin"
    ];

    const CATEGORIES = [
      {title:"Our Church",desc:"Unity, vision, and spiritual growth",prompts:[
        "Pray for a spirit of unity to bind our congregation together in love.",
        "Ask God to give clear vision and direction to our pastoral team.",
        "Pray that every member experiences deep, transformative spiritual growth.",
        "Lift up our volunteer teams, asking for joy and endurance in their service."
      ]},
      {title:"Our Community",desc:"Schools, leaders, and lasting peace",prompts:[
        "Ask for protection and wisdom for our local teachers, students, and administrators.",
        "Pray for city officials and first responders to have discernment and safety.",
        "Pray that our church would be a beacon of hope and practical help in our neighborhoods.",
        "Ask for peace and reconciliation in areas of our community experiencing division."
      ]},
      {title:"Families",desc:"Marriages, children, and relationships",prompts:[
        "Pray for marriages to be strengthened, characterized by grace and mutual respect.",
        "Lift up parents, asking for patience and wisdom in raising the next generation.",
        "Pray for prodigal children to experience God's love and return home.",
        "Ask for comfort and community support for single parents and those navigating loss."
      ]},
      {title:"Healing",desc:"Physical, mental, and emotional restoration",prompts:[
        "Lift up those in our church family battling chronic illness or sudden medical crises.",
        "Pray for individuals struggling with anxiety, depression, or other mental health challenges.",
        "Ask God to provide comfort and peace that surpasses understanding to those grieving.",
        "Pray for doctors, nurses, and caregivers to have stamina and wisdom."
      ]}
    ];

    const GENERAL = {
      title:"General Prayer",
      prompts:CATEGORIES.flatMap(c=>c.prompts)
    };

    function formatTime(ms) {
      return new Intl.DateTimeFormat("en-US",{
        timeZone:"America/New_York",hour:"numeric",minute:"2-digit"
      }).format(new Date(ms));
    }

    function countdown(ms) {
      if (ms <= 0) return "00:00";
      const s = Math.ceil(ms/1000);
      const h = Math.floor(s/3600);
      const m = Math.floor((s%3600)/60);
      const sec = s%60;
      return h>0 ? `${h}h ${m}m ${String(sec).padStart(2,"0")}s` : `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
    }

    function App() {
      const [now,setNow] = useState(Date.now());
      const [session,setSession] = useState(null);
      const [thanks,setThanks] = useState(false);

      useEffect(()=>{
        const id=setInterval(()=>setNow(Date.now()),1000);
        return ()=>clearInterval(id);
      },[]);

      const state = now < EVENT_START ? "before" : now >= EVENT_END ? "completed" : "in-progress";
      const elapsed = Math.max(0, Math.min(EVENT_END-EVENT_START, now-EVENT_START));
      const idx = Math.max(0, Math.min(23, Math.floor(elapsed/HOUR)));
      const progress = elapsed/(EVENT_END-EVENT_START);
      const nextBoundary = EVENT_START + (idx+1)*HOUR;

      const closeSession = () => {
        setSession(null);
        setThanks(true);
        setTimeout(()=>setThanks(false),4000);
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 overflow-x-hidden">
          <div className="fixed inset-0 pointer-events-none overflow-hidden">
            <div className="absolute -top-20 -right-20 w-96 h-96 rounded-full bg-slate-800/30 blur-3xl"></div>
            <div className="absolute top-1/3 -left-20 w-80 h-80 rounded-full bg-orange-900/20 blur-3xl"></div>
          </div>

          <div className="relative z-10 max-w-6xl mx-auto px-4 pb-24">
            <header className="pt-10 pb-8 text-center">
              <img src="image.png" alt="The Foundery Church" className="h-24 md:h-28 w-auto mx-auto mb-5 object-contain" onError={(e)=>{e.currentTarget.style.display="none"}} />
              <h1 className="text-3xl md:text-5xl font-light tracking-tight"><strong>24 HOURS</strong> OF PRAYER</h1>
              <p className="text-slate-300 mt-3">One Church. One Prayer. Every Hour.</p>
              <p className="text-orange-400 uppercase tracking-[.22em] text-xs font-semibold mt-2">Sundays Are Just the Start.</p>
              <p className="text-slate-500 text-xs mt-4">The Foundery Church · Wellsburg, West Virginia</p>
            </header>

            <main className="grid lg:grid-cols-12 gap-8">
              <section className="lg:col-span-5">
                <PrayerOrbit state={state} index={idx} progress={progress} now={now} nextBoundary={nextBoundary} />

                <button onClick={()=>setSession(GENERAL)} className="w-full mt-5 rounded-2xl bg-orange-600 hover:bg-orange-500 py-4 font-bold tracking-widest uppercase flex items-center justify-center gap-3 shadow-lg">
                  <Icon name="play" size={18}/>
                  {state==="in-progress" ? "Join this hour in prayer" : "Take a moment to pray"}
                </button>

                <div className="h-8 flex items-center justify-center text-emerald-400 text-sm">{thanks ? "Thank you for joining us in prayer." : ""}</div>
                <ShareControls/>
              </section>

              <section className="lg:col-span-7 space-y-10">
                <div>
                  <div className="flex items-end justify-between mb-4 gap-3">
                    <h2 className="text-2xl font-light">Prayer Schedule</h2>
                    <span className="text-xs uppercase tracking-widest text-slate-400 bg-slate-900 border border-slate-800 rounded-full px-3 py-1">
                      {state==="before" ? "Upcoming" : state==="completed" ? "Completed" : `Hour ${idx+1} of 24`}
                    </span>
                  </div>
                  <Timeline state={state} index={idx}/>
                </div>

                <div>
                  <h2 className="text-2xl font-light mb-4">Prayer Focus</h2>
                  <div className="grid sm:grid-cols-2 gap-4">
                    {CATEGORIES.map((c,i)=>(
                      <button key={i} onClick={()=>setSession(c)} className="glass-panel rounded-2xl p-5 text-left hover:border-orange-500/50 transition">
                        <div className="flex items-center justify-between gap-3">
                          <span className="font-medium">{c.title}</span>
                          <Icon name="arrow-right" size={16} className="text-slate-500"/>
                        </div>
                        <p className="text-slate-400 text-sm mt-2">{c.desc}</p>
                      </button>
                    ))}
                  </div>
                </div>

                <div className="glass-panel rounded-3xl p-6 md:p-8">
                  <PrayerRequestForm/>
                </div>
              </section>
            </main>
          </div>

          {session && <PrayerSession category={session} onClose={closeSession}/>}
        </div>
      );
    }

    function PrayerOrbit({state,index,progress,now,nextBoundary}) {
      const current = SCHEDULE[index];
      const next = index < 23 ? SCHEDULE[index+1] : null;
      const start = EVENT_START + index*HOUR;
      const end = start + HOUR;
      const radius=112;
      const circumference=2*Math.PI*radius;
      const offset=circumference-(progress*circumference);

      return (
        <div className="flex flex-col items-center">
          <div className="relative w-full max-w-[360px] aspect-square">
            <svg viewBox="0 0 260 260" className="absolute inset-0 w-full h-full">
              <defs>
                <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stopColor="#f97316"/><stop offset="1" stopColor="#ea580c"/></linearGradient>
              </defs>
              <circle cx="130" cy="130" r={radius} fill="none" stroke="rgba(255,255,255,.07)" strokeWidth="3"/>
              {state!=="before" && <circle cx="130" cy="130" r={radius} fill="none" stroke="url(#g)" strokeWidth="5" strokeLinecap="round" strokeDasharray={circumference} strokeDashoffset={offset} transform="rotate(-90 130 130)"/>}
            </svg>

            <div className="absolute inset-0 flex flex-col items-center justify-center text-center p-10">
              {state==="in-progress" && <>
                <div className="flex items-center gap-2 text-orange-400 text-xs font-semibold tracking-widest uppercase mb-4">
                  <span className="w-2 h-2 rounded-full bg-orange-500 pulse-dot"></span> Praying Now
                </div>
                <h3 className="text-2xl md:text-3xl font-light">{current}</h3>
                <p className="text-slate-300 text-sm mt-2 tracking-widest uppercase">{formatTime(start)} – {formatTime(end)}</p>
                <p className="text-slate-500 text-xs mt-4">Right now, {current} is carrying the prayer forward.</p>
              </>}
              {state==="before" && <>
                <h3 className="text-2xl font-light">Begins Soon</h3>
                <p className="text-orange-400 mt-2">September 29, 2026</p>
                <p className="text-slate-400 text-sm mt-1">12:00 AM Eastern Time</p>
              </>}
              {state==="completed" && <>
                <h3 className="text-2xl font-light">Completed</h3>
                <p className="text-slate-400 text-sm mt-2">Thank you for being part of the unbroken chain.</p>
              </>}
            </div>
          </div>

          <div className="h-12 text-center">
            {state==="in-progress" && (next
              ? <><p className="text-sm text-slate-300">Next: <span className="text-white">{next}</span></p><p className="text-xs text-slate-500 mt-1">Begins in {countdown(nextBoundary-now)}</p></>
              : <><p className="text-sm text-slate-300">Our final hour</p><p className="text-xs text-slate-500 mt-1">Ends in {countdown(EVENT_END-now)}</p></>
            )}
            {state==="before" && <p className="text-sm text-slate-400">Event starts in <span className="text-white font-mono">{countdown(EVENT_START-now)}</span></p>}
          </div>
        </div>
      );
    }

    function Timeline({state,index}) {
      const ref = useRef(null);
      useEffect(()=>{
        if(state==="in-progress" && ref.current){
          const el=ref.current.querySelector('[data-current="true"]');
          if(el) setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"center"}),100);
        }
      },[state,index]);

      return (
        <div className="glass-panel rounded-3xl p-4 sm:p-6">
          <div ref={ref} className="max-h-[410px] overflow-y-auto scrollbar-custom pr-2">
            {SCHEDULE.map((name,i)=>{
              const past=state==="completed" || (state==="in-progress" && i<index);
              const current=state==="in-progress" && i===index;
              return (
                <div key={i} data-current={current?"true":"false"} className={`flex items-center gap-4 py-3 px-3 rounded-xl border ${current?"bg-orange-900/20 border-orange-500/20":"border-transparent"} ${past?"opacity-55":""}`}>
                  <div className="w-6 flex justify-center">
                    {past ? <Icon name="circle-check" size={22} className="text-slate-500"/> : <span className={`w-3 h-3 rounded-full ${current?"bg-orange-500":"bg-slate-700"}`}></span>}
                  </div>
                  <div className="min-w-0 flex-1 flex items-center justify-between gap-4">
                    <span className={`truncate ${current?"font-semibold text-white":"text-slate-200"}`}>{name}</span>
                    <span className={`font-mono text-sm shrink-0 ${current?"text-orange-400":"text-slate-500"}`}>{formatTime(EVENT_START+i*HOUR)}</span>
                  </div>
                </div>
              );
            })}
          </div>
          <p className="text-center text-xs text-slate-500 mt-4 pt-4 border-t border-slate-800">All times shown in Eastern Time.</p>
        </div>
      );
    }

    function PrayerSession({category,onClose}) {
      const [i,setI]=useState(0);
      const [auto,setAuto]=useState(false);
      const [start]=useState(Date.now());
      const [elapsed,setElapsed]=useState(0);

      useEffect(()=>{
        const id=setInterval(()=>setElapsed(Date.now()-start),1000);
        return ()=>clearInterval(id);
      },[start]);

      useEffect(()=>{
        if(!auto) return;
        const id=setInterval(()=>setI(v=>(v+1)%category.prompts.length),30000);
        return ()=>clearInterval(id);
      },[auto,category.prompts.length]);

      useEffect(()=>{
        const fn=(e)=>{
          if(e.key==="Escape") onClose();
          if(e.key==="ArrowRight") setI(v=>(v+1)%category.prompts.length);
          if(e.key==="ArrowLeft") setI(v=>(v-1+category.prompts.length)%category.prompts.length);
        };
        window.addEventListener("keydown",fn);
        document.body.style.overflow="hidden";
        return ()=>{window.removeEventListener("keydown",fn);document.body.style.overflow="";};
      },[onClose,category.prompts.length]);

      const total=Math.floor(elapsed/1000);
      const elapsedText=`${Math.floor(total/60)}:${String(total%60).padStart(2,"0")}`;

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex items-center justify-center p-4">
          <div className="glass-panel bg-slate-900 rounded-3xl w-full max-w-3xl overflow-hidden shadow-2xl">
            <div className="flex items-center justify-between p-5 border-b border-white/10">
              <h2 className="text-orange-400 font-medium">{category.title}</h2>
              <button onClick={onClose} className="w-10 h-10 rounded-full bg-white/5 grid place-items-center"><Icon name="x" size={20}/></button>
            </div>
            <div className="min-h-[310px] p-8 md:p-12 flex items-center justify-center text-center">
              <p className="text-2xl md:text-4xl font-light leading-relaxed">“{category.prompts[i]}”</p>
            </div>
            <div className="p-5 bg-slate-950/50">
              <div className="flex justify-center gap-2 mb-6">
                {category.prompts.map((_,n)=><button key={n} onClick={()=>setI(n)} className={`h-2 rounded-full ${n===i?"w-8 bg-orange-500":"w-2 bg-white/20"}`} aria-label={`Prayer prompt ${n+1}`}></button>)}
              </div>
              <div className="flex flex-col sm:flex-row items-center justify-between gap-4">
                <div className="flex items-center gap-2">
                  <button onClick={()=>setI(v=>(v-1+category.prompts.length)%category.prompts.length)} className="w-11 h-11 rounded-full hover:bg-white/10 grid place-items-center"><Icon name="chevron-left" size={24}/></button>
                  <button onClick={()=>setAuto(v=>!v)} className={`h-11 px-4 rounded-full border flex items-center gap-2 ${auto?"border-orange-500/30 text-orange-400 bg-orange-500/10":"border-white/10 text-slate-300"}`}><Icon name={auto?"pause":"play"} size={18}/> Auto</button>
                  <button onClick={()=>setI(v=>(v+1)%category.prompts.length)} className="w-11 h-11 rounded-full hover:bg-white/10 grid place-items-center"><Icon name="chevron-right" size={24}/></button>
                </div>
                <div className="flex items-center gap-5">
                  <div className="text-right">
                    <div className="text-[10px] text-slate-500 uppercase tracking-wider">Praying for</div>
                    <div className="font-mono text-slate-300">{elapsedText}</div>
                  </div>
                  <button onClick={onClose} className="h-11 px-5 rounded-xl bg-white/10 hover:bg-white/20">Finish Praying</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function PrayerRequestForm() {
      const [status,setStatus]=useState("idle");
      const [error,setError]=useState("");

      const submit=(e)=>{
        e.preventDefault();
        const data=new FormData(e.currentTarget);
        const request=String(data.get("request")||"").trim();
        const name=String(data.get("name")||"").trim();
        if(!request){setError("Please enter a prayer request.");return;}
        setError("");
        setStatus("sending");

        const subject=encodeURIComponent("New Prayer Request — The Foundery Church");
        const body=encodeURIComponent(`Name: ${name || "Anonymous"}\n\nPrayer Request:\n${request}`);
        window.location.href=`mailto:office@thefoundery.church?subject=${subject}&body=${body}`;
        setStatus("sent");
        e.currentTarget.reset();
      };

      return (
        <form onSubmit={submit} className="space-y-4">
          <div>
            <h3 className="text-2xl font-light">How can we pray for you?</h3>
            <p className="text-slate-400 text-sm mt-1">Your request will be addressed to office@thefoundery.church.</p>
          </div>

          <div>
            <label htmlFor="name" className="text-sm text-slate-300">Name <span className="text-slate-500">(Optional)</span></label>
            <input id="name" name="name" maxLength="100" className="mt-1.5 w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-orange-500/50"/>
          </div>

          <div>
            <label htmlFor="request" className="text-sm text-slate-300">Prayer Request</label>
            <textarea id="request" name="request" required rows="5" maxLength="2000" className="mt-1.5 w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-3 outline-none resize-none focus:border-orange-500/50"></textarea>
          </div>

          {error && <p className="text-red-400 text-sm">{error}</p>}
          {status==="sent" && <p className="text-emerald-400 text-sm">Your email app should open with the prayer request ready to send.</p>}

          <button disabled={status==="sending"} className="w-full rounded-xl py-3.5 bg-white/5 hover:bg-white/10 border border-white/10 font-medium">
            Send Request
          </button>
        </form>
      );
    }

    function ShareControls(){
      const [copied,setCopied]=useState(false);
      const copy=async()=>{
        try{
          await navigator.clipboard.writeText(location.href);
          setCopied(true);setTimeout(()=>setCopied(false),2500);
        }catch{}
      };
      const share=async()=>{
        if(navigator.share){
          try{await navigator.share({title:"24 Hours of Prayer - The Foundery Church",text:"Join The Foundery Church in 24 Hours of Prayer.",url:location.href});return;}catch{}
        }
        copy();
      };
      return (
        <div className="glass-panel rounded-2xl p-1.5 flex gap-1 max-w-sm mx-auto">
          <button onClick={copy} className="flex-1 py-3 rounded-xl hover:bg-white/5 text-xs uppercase tracking-widest flex items-center justify-center gap-2"><Icon name="copy" size={16}/>{copied?"Copied!":"Copy Link"}</button>
          <div className="w-px bg-slate-700 my-2"></div>
          <button onClick={share} className="flex-1 py-3 rounded-xl hover:bg-white/5 text-xs uppercase tracking-widest flex items-center justify-center gap-2"><Icon name="share-2" size={16}/>Share</button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
